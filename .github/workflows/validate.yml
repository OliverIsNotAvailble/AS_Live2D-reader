name: Python syntax and manifest tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python source
        run: python -m compileall -q main.py as_live2d tests
      - name: Run model/manifest tests
        run: python -m unittest discover -s tests -v
